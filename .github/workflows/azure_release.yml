name: Publish Containers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/luminapath-api
  FRONTEND_IMAGE: ${{ github.repository_owner }}/luminapath-frontend
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}

jobs:
  publish:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API Metadata
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Frontend Metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/LuminaPath/Dockerfile
          push: true
          tags: |
            ${{ steps.api_meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.api_meta.outputs.labels }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: src/LuminaPath.MobileApp
          file: src/LuminaPath.MobileApp/Dockerfile
          push: true
          tags: |
            ${{ steps.frontend_meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

      - name: Azure Login
        if: env.AZURE_WEBAPP_NAME != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Azure Web App
        if: env.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:sha-${{ github.sha }}
