name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish (for example v1.2.3)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  API_IMAGE: luminapath-api
  FRONTEND_IMAGE: luminapath-frontend

jobs:
  prepare:
    name: Source and licenses
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Validate version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Archive exact source and licenses
        id: source
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD)"
          export SOURCE_REVISION
          echo "revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/release
          git archive --format=tar.gz --prefix="LuminaPath-${RELEASE_TAG}/" --output="artifacts/release/LuminaPath-${RELEASE_TAG}-source.tar.gz" "$SOURCE_REVISION"
          node scripts/prepare-legal.mjs artifacts/release-notices
          tar -czf "artifacts/release/LuminaPath-${RELEASE_TAG}-licenses.tar.gz" -C artifacts/release-notices .
          printf 'LuminaPath %s\nSource revision: %s\nRepository: %s\nSource archive: %s/archive/%s.tar.gz\nLicense: AGPL-3.0-only\n' "$RELEASE_TAG" "$SOURCE_REVISION" "$SOURCE_REPOSITORY" "$SOURCE_REPOSITORY" "$SOURCE_REVISION" > artifacts/release/SOURCE.txt

      - name: Upload source and licenses
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: artifacts/release/*
          if-no-files-found: error

  dockerhub:
    name: Docker Hub Images
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: API Metadata
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=sha-${{ needs.prepare.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Frontend Metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=sha-${{ needs.prepare.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/LuminaPath/Dockerfile
          build-args: |
            SOURCE_REVISION=${{ needs.prepare.outputs.revision }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/LuminaPath.MobileApp/Dockerfile
          build-args: |
            SOURCE_REVISION=${{ needs.prepare.outputs.revision }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: prepare
    env:
      SOURCE_REVISION: ${{ needs.prepare.outputs.revision }}
      SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/LuminaPath.MobileApp/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: src/LuminaPath.MobileApp
        run: npm ci

      - name: Build web app
        working-directory: src/LuminaPath.MobileApp
        run: npm run build -- --configuration production

      - name: Generate Capacitor Android project
        working-directory: src/LuminaPath.MobileApp
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew

      - name: Check Android license inventory
        run: |
          mkdir -p artifacts
          cd src/LuminaPath.MobileApp/android
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > ../../../artifacts/android-dependencies.txt
          cd ../../..
          python scripts/update-android-licenses.py artifacts/android-dependencies.txt --check

      - name: Build debug APK
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        working-directory: src/LuminaPath.MobileApp/android
        run: |
          ./gradlew assembleDebug
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "../artifacts/LuminaPath-${RELEASE_TAG}-debug.apk"

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        working-directory: src/LuminaPath.MobileApp/android
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          ./gradlew assembleRelease
          mkdir -p ../artifacts
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "../artifacts/LuminaPath-${RELEASE_TAG}-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out "../artifacts/LuminaPath-${RELEASE_TAG}.apk" \
            "../artifacts/LuminaPath-${RELEASE_TAG}-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify "../artifacts/LuminaPath-${RELEASE_TAG}.apk"
          rm "../artifacts/LuminaPath-${RELEASE_TAG}-aligned.apk"

      - name: Verify APK legal assets
        run: |
          for apk in src/LuminaPath.MobileApp/artifacts/*.apk; do
            python scripts/verify-apk.py "$apk"
          done
          cp src/LuminaPath.MobileApp/www/browser/assets/legal/web-licenses.txt src/LuminaPath.MobileApp/artifacts/web-licenses.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            src/LuminaPath.MobileApp/artifacts/*.apk
            src/LuminaPath.MobileApp/artifacts/web-licenses.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, dockerhub, android]
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/release

      - name: Hash release files
        working-directory: artifacts/release
        run: sha256sum ./*.apk ./*.tar.gz ./*.txt > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          name: LuminaPath ${{ env.RELEASE_TAG }}
          files: artifacts/release/*
          generate_release_notes: true
