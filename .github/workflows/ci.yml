name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Test/Test.csproj --ignore-failed-sources

      - name: Build
        run: dotnet build src/LuminaPath/LuminaPath.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Test/Test.csproj --configuration Release --no-restore --logger trx --results-directory TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Angular Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LuminaPath.MobileApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/LuminaPath.MobileApp/package-lock.json

      - name: Install
        run: npm install

      - name: Build
        run: npm run build -- --configuration production

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f docker-compose.yml -f docker-compose.frontend.yml -f docker-compose.tools.yml config

      - name: Build API Image
        run: docker build -t luminapath-api:ci -f Dockerfile .

      - name: Build Frontend Image
        run: docker build -t luminapath-frontend:ci -f src/LuminaPath.MobileApp/Dockerfile src/LuminaPath.MobileApp
