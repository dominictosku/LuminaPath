name: Build and Deploy To Azure

on:
  push:
    branches:
      - main
env:
  CONTAINER_REGISTRY: ${{ secrets.REGISTRY_URL }}
  IMAGE_TAG: ${{ github.sha }}
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v3

    - name: Sign in with Service Principal
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}    

    - name: Azure Registry authentication
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }} 

    - name: Copy Dockerfile to project root
      run: cp ./src/LuminaPath/Dockerfile .  

    - name: Docker Build & Push to Registry
      run: |
        docker build . -t ${{ env.CONTAINER_REGISTRY }}/luminapath-server:${{ env.IMAGE_TAG }}
        docker push ${{ env.CONTAINER_REGISTRY }}/luminapath-server:${{ env.IMAGE_TAG }}

    - uses: azure/webapps-deploy@v2
      with:
        app-name: 'milchbuechli'
        images: '${{ env.CONTAINER_REGISTRY }}/luminapath-server:${{ env.IMAGE_TAG }}'

    - name: Azure logout
      run: |
        az logout
