services:
  api:
    image: luminapath-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: src/LuminaPath/Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8080}:8080"

  frontend:
    image: luminapath-frontend:local
    pull_policy: build
    build:
      context: .
      dockerfile: src/LuminaPath.MobileApp/Dockerfile

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
