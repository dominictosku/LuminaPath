name: luminapath

services:
  luminapath-api:
    image: ${LUMINAPATH_API_IMAGE:-dominictosku/luminapath-api:latest}
    container_name: luminapath-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=luminapath-db;Port=5432;Database=${POSTGRES_DB:-luminapath};Username=${POSTGRES_USER:-luminapath};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env};"
      ConnectionStrings__Redis: luminapath-redis:6379
      Database__RunMigrationsOnStartup: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      Https__Redirect: ${HTTPS_REDIRECT:-false}
      Storage__Provider: ${STORAGE_PROVIDER:-FileSystem}
      Storage__Path: ${STORAGE_PATH:-/app/App_Data/storage}
      Serilog__WriteTo__1__Args__path: ${LOG_PATH:-/app/App_Data/logs/luminapath-.log}
      Azure__BlobConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      Azure__BlobContainerName: ${AZURE_BLOB_CONTAINER_NAME:-media}
      # Optional. Leave empty when the frontend proxies /api same-origin.
      # Set an exact public HTTPS origin only when browsers call the API cross-origin.
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-}
      Auth__CookieSameSite: ${AUTH_COOKIE_SAMESITE:-Lax}
      Auth__CookieSecurePolicy: ${AUTH_COOKIE_SECURE_POLICY:-Always}
      # When true, newly self-registered users land inactive and cannot
      # sign in until an admin flips the toggle on /Admin/Users. The
      # compose-default mirrors appsettings.json (true = production-safe);
      # override to false in .env for friction-free local testing.
      # See src/README.md → "Require admin approval for new registrations".
      Auth__RequireAdminApproval: ${AUTH_REQUIRE_ADMIN_APPROVAL:-true}
      # Seed admin credentials — only used the first time the database
      # is brought up (when no admin user exists yet). Production startup
      # refuses the bundled placeholders.
      Admin__Email: ${LUMINAPATH_ADMIN_EMAIL:?Set LUMINAPATH_ADMIN_EMAIL in deploy/.env}
      Admin__Password: ${LUMINAPATH_ADMIN_PASSWORD:?Set LUMINAPATH_ADMIN_PASSWORD in deploy/.env}
    expose:
      - "8080"
    volumes:
      - luminapath-storage:${STORAGE_PATH:-/app/App_Data/storage}
      - luminapath-logs:/app/App_Data/logs
    depends_on:
      luminapath-db:
        condition: service_healthy
      luminapath-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  luminapath-redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: luminapath-redis
    restart: unless-stopped
    volumes:
      - luminapath-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  luminapath-frontend:
    image: ${LUMINAPATH_FRONTEND_IMAGE:-dominictosku/luminapath-frontend:latest}
    container_name: luminapath-frontend
    restart: unless-stopped
    environment:
      LUMINAPATH_API_ENDPOINT: ${LUMINAPATH_API_ENDPOINT:-/api}
      LUMINAPATH_API_PROXY_TARGET: ${LUMINAPATH_API_PROXY_TARGET:-http://luminapath-api:8080}
    ports:
      - "${FRONTEND_HTTP_PORT:-4200}:80"
    depends_on:
      luminapath-api:
        condition: service_healthy

  luminapath-db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: luminapath-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luminapath}
      POSTGRES_USER: ${POSTGRES_USER:-luminapath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - luminapath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luminapath} -d ${POSTGRES_DB:-luminapath}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  luminapath-postgres:
  luminapath-storage:
  luminapath-logs:
  luminapath-redis:
