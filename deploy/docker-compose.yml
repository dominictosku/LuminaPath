name: luminapath

services:
  luminapath-api:
    image: ${LUMINAPATH_API_IMAGE:-sekijuo/luminapath-api:latest}
    container_name: luminapath-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=luminapath-db;Port=5432;Database=${POSTGRES_DB:-luminapath};Username=${POSTGRES_USER:-luminapath};Password=${POSTGRES_PASSWORD:-change-me};
      ConnectionStrings__Redis: luminapath-redis:6379
      Database__RunMigrationsOnStartup: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      Https__Redirect: ${HTTPS_REDIRECT:-false}
      Storage__Provider: ${STORAGE_PROVIDER:-FileSystem}
      Storage__Path: ${STORAGE_PATH:-/app/App_Data/storage}
      Serilog__WriteTo__1__Args__path: ${LOG_PATH:-/app/App_Data/logs/luminapath-.log}
      Azure__BlobConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      Azure__BlobContainerName: ${AZURE_BLOB_CONTAINER_NAME:-media}
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${IONIC_PUBLIC_URL:-capacitor://localhost}
      Cors__AllowedOrigins__2: ${CAPACITOR_ANDROID_PUBLIC_URL:-http://localhost}
      Cors__AllowedOrigins__3: ${CAPACITOR_ANDROID_HTTPS_PUBLIC_URL:-https://localhost}
      Auth__CookieSameSite: ${AUTH_COOKIE_SAMESITE:-None}
      Auth__CookieSecurePolicy: ${AUTH_COOKIE_SECURE_POLICY:-Always}
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    volumes:
      - luminapath-storage:${STORAGE_PATH:-/app/App_Data/storage}
      - luminapath-logs:/app/App_Data/logs
    depends_on:
      luminapath-db:
        condition: service_healthy
      luminapath-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  luminapath-redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: luminapath-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - luminapath-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  luminapath-frontend:
    image: ${LUMINAPATH_FRONTEND_IMAGE:-sekijuo/luminapath-frontend:latest}
    container_name: luminapath-frontend
    restart: unless-stopped
    environment:
      LUMINAPATH_API_ENDPOINT: ${LUMINAPATH_API_ENDPOINT:-/api}
      LUMINAPATH_API_PROXY_TARGET: ${LUMINAPATH_API_PROXY_TARGET:-http://luminapath-api:8080}
    ports:
      - "${FRONTEND_HTTP_PORT:-4200}:80"
    depends_on:
      luminapath-api:
        condition: service_healthy

  luminapath-db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: luminapath-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luminapath}
      POSTGRES_USER: ${POSTGRES_USER:-luminapath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - luminapath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luminapath} -d ${POSTGRES_DB:-luminapath}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  luminapath-postgres:
  luminapath-storage:
  luminapath-logs:
  luminapath-redis:
