services:
  luminapath-api:
    environment:
      Database__PasswordFile: /run/secrets/luminapath_postgres_password
      Admin__PasswordFile: /run/secrets/luminapath_admin_password
    secrets:
      - luminapath_postgres_password
      - luminapath_admin_password

  luminapath-db:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/luminapath_postgres_password
    secrets:
      - luminapath_postgres_password

secrets:
  luminapath_postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password.txt}
  luminapath_admin_password:
    file: ${LUMINAPATH_ADMIN_PASSWORD_SECRET_FILE:-./secrets/admin_password.txt}
