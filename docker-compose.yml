version: '3'
name: luminapath-compose

services:
  frontend:
    container_name: luminapath-frontend
    build:
      context: ./LuminaPath-Frontend
      dockerfile: Dockerfile
    ports:
      - 3000

  backend:
    container_name: luminapath-backend
    build:
      context: ./LuminaPath-Backend
      dockerfile: luminapath/Dockerfile
    depends_on:
        - db
  db:
     image: "mcr.microsoft.com/mssql/server:2022-latest"
     container_name: luminapath_DB
     volumes:
         - luminapath-DB:/var/opt/mssql
    
  nginx:
    image: nginx:latest
    container_name: luminapath-proxy
    ports:
      - 8005:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
    luminapath-DB:  
