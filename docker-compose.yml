version: '3'
name: luminapath-compose

services:
  frontend:
    container_name: luminapath-frontend
    build:
      context: ./LuminaPath-Frontend
      dockerfile: Dockerfile
    environment:
      - NUXT_API_ENDPOINT=backend
    ports:
      - 3000
    depends_on:
      - backend

  backend:
    container_name: luminapath-backend
    build:
      context: ./LuminaPath-Backend
      dockerfile: LuminaPath/Dockerfile
    depends_on:
        - db
  db:
     image: mysql:latest
     container_name: luminapath_DB
     environment:
       MYSQL_ROOT_PASSWORD: dbuserpassword
       MYSQL_DATABASE: luminapath
     volumes:
         - luminapath-DB:/var/lib/mysql
     ports:
         - "3306:3306"
    
  nginx:
    image: nginx:latest
    container_name: luminapath-proxy
    ports:
      - 8005:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  blob:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: luminapath-blob
    volumes:
      - luminapath-blob:/data
    ports:
      - 10000:10000

volumes:
    luminapath-DB:
    luminapath-blob:  
