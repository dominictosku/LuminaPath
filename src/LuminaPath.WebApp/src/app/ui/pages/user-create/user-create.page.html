<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>userCreate</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form class="space-y-6" type="form">
    <div>
      <label for="userName" class="block text-sm font-medium leading-6 text-white">Username</label>
      <div class="mt-2">
        <input id="userName" [(ngModel)]="credentials.userName" name="userName" required
          class="block w-full rounded-md border-0 py-1.5 text-white shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
      </div>
      <label for="userName" class="block text-sm font-medium leading-6 text-white">Email</label>
      <div class="mt-2">
        <input id="Email" [(ngModel)]="credentials.email" name="Email" required
          class="block w-full rounded-md border-0 py-1.5 text-white shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
      </div>
    </div>
    <div>
      <div class="mt-2">
        <input [(ngModel)]="credentials.password" type="password" name="password" label="Password"
          validation="required|length:6|matches:/[^a-zA-Z]/" :validation-messages="{
                        matches: 'Please include at least one symbol',
                    }" placeholder="Your password" help="Choose a password" />
        <input type="password" name="password_confirm" label="Confirm password" placeholder="Confirm password"
          validation="required|confirm" help="Confirm your password" />
      </div>
    </div>

    <div>
      <ion-button type="submit" label="Create account" />
    </div>
  </form>
</ion-content>
