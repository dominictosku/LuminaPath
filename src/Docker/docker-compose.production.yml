services:
  luminapath:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    ports:
      - 80
  nginx:
    image: nginx:latest
    container_name: luminapath-proxy
    ports:
      - 8005:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - luminapath
