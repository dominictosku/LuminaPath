<ion-content [fullscreen]="true" class="planning-shell">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <main class="planning-page mt-12">
    <header class="planning-hero">
      <span class="eyebrow">
        <ion-icon name="rocket-outline"></ion-icon>
        Release plan
      </span>
      <h1>Plan around upcoming releases</h1>
      <p>Balance active games, backlog commitments, and release dates in one lightweight view.</p>
    </header>

    <app-release-plan
      [games]="allGames"
      [isLoading]="isLoading"
      [errorMessage]="errorMessage">
    </app-release-plan>
  </main>
</ion-content>
