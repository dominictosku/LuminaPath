<ion-content [fullscreen]="true" class="statistic-shell">
  <ion-refresher slot="fixed" (ionRefresh)="loadStatistic($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <main class="statistic-page">
    <app-statistic-hero
      [healthScore]="healthScore"
      [healthTone]="healthTone"
      [isLoading]="isLoading">
    </app-statistic-hero>

    @if (errorMessage) {
      <section class="notice">
        <ion-icon name="flame-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </section>
    }

    <app-statistic-metrics [metrics]="metrics" [isLoading]="isLoading"></app-statistic-metrics>

    @if (!isLoading) {
      <app-statistic-media-mix [segments]="donutSegments" [total]="donutTotal"></app-statistic-media-mix>
      <app-statistic-completion-trend [trend]="trend"></app-statistic-completion-trend>
      <app-statistic-rating-histogram
        [buckets]="ratingBuckets"
        [count]="ratedCount"
        [average]="averageRating">
      </app-statistic-rating-histogram>
      <app-statistic-time-by-type [bars]="timeBars"></app-statistic-time-by-type>
      <app-statistic-top-genres [genres]="topGenres"></app-statistic-top-genres>

      @if (statusSlices.length) {
        <app-statistic-status-mix [slices]="statusSlices"></app-statistic-status-mix>
      }

      <app-statistic-health-flags [flags]="flags"></app-statistic-health-flags>
      <app-statistic-quick-wins [items]="quickWins"></app-statistic-quick-wins>
      <app-statistic-longest-commitments [items]="longCommitments"></app-statistic-longest-commitments>

      @if (topRated.length) {
        <app-statistic-top-rated [items]="topRated"></app-statistic-top-rated>
      }

      <app-statistic-breakdown [rows]="breakdown"></app-statistic-breakdown>
    }

    @if (psnTrophyTotals) {
      <app-statistic-psn-trophies [totals]="psnTrophyTotals"></app-statistic-psn-trophies>
    }
  </main>
</ion-content>
