<div class="modal-backdrop folder-backdrop" (click)="onClose()">
  <form class="quest-modal folder-modal" (click)="$event.stopPropagation()" (ngSubmit)="onSubmit($event)">
    <button type="button" class="modal-close" aria-label="Close" (click)="onClose()">
      <ion-icon name="close-outline"></ion-icon>
    </button>

    <h2>{{ title() }}</h2>

    <!-- Name + a live preview chip so the chosen emoji/colour pair shows
         what the folder will actually look like in the sidebar. -->
    <label class="folder-modal__field">
      <span>Name</span>
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="folderName"
        maxlength="80"
        placeholder="e.g. Projects"
        autocomplete="off"
        required />
    </label>

    @if (canSubmit() || color()) {
      <div
        class="folder-modal__preview"
        [style.--preview-accent]="color() || 'var(--accent)'">
        <span class="folder-modal__preview-rail" aria-hidden="true"></span>
        <span class="folder-modal__preview-emoji" aria-hidden="true">{{ emoji() || '·' }}</span>
        <span class="folder-modal__preview-name">{{ name() || 'Folder preview' }}</span>
      </div>
    }

    <!-- Emoji picker — 8-col swatch grid + free-form text input as
         escape hatch for any emoji that isn't in the curated set. -->
    <div class="folder-modal__field">
      <span>Emoji</span>
      <div class="emoji-grid" role="listbox" aria-label="Folder emoji">
        @for (glyph of emojiPresets; track glyph) {
          <button
            type="button"
            class="emoji-swatch"
            role="option"
            [class.emoji-swatch--active]="isEmojiActive(glyph)"
            [attr.aria-selected]="isEmojiActive(glyph)"
            [attr.aria-label]="glyph"
            (click)="selectEmoji(glyph)">
            {{ glyph }}
          </button>
        }
      </div>
      <input
        type="text"
        class="emoji-custom"
        [ngModel]="emoji()"
        (ngModelChange)="emoji.set($event)"
        name="folderEmoji"
        maxlength="6"
        placeholder="Or paste a custom emoji"
        autocomplete="off" />
    </div>

    <!-- Colour swatch row. Includes a "Default" tile that clears the
         override so the folder falls back to the page accent. -->
    <div class="folder-modal__field">
      <span>Accent colour</span>
      <div class="color-grid" role="listbox" aria-label="Folder accent colour">
        <button
          type="button"
          class="color-swatch color-swatch--default"
          role="option"
          [class.color-swatch--active]="!hasColor()"
          [attr.aria-selected]="!hasColor()"
          aria-label="Default colour"
          (click)="selectColor(null)">
          <ion-icon name="ban-outline" aria-hidden="true"></ion-icon>
        </button>
        @for (swatch of colorPresets; track swatch.value) {
          <button
            type="button"
            class="color-swatch"
            role="option"
            [class.color-swatch--active]="isSwatchActive(swatch)"
            [attr.aria-selected]="isSwatchActive(swatch)"
            [attr.aria-label]="swatch.label"
            [title]="swatch.label"
            [style.--swatch-color]="swatch.value"
            (click)="selectColor(swatch.value)">
          </button>
        }
      </div>
    </div>

    <label class="folder-modal__field">
      <span>Section <small>(optional grouping header)</small></span>
      <input
        type="text"
        [ngModel]="sectionName()"
        (ngModelChange)="sectionName.set($event)"
        name="folderSection"
        maxlength="48"
        placeholder="e.g. Lists, Pinned"
        autocomplete="off" />
      @if (sectionSuggestions().length) {
        <div class="folder-modal__suggestions">
          @for (suggestion of sectionSuggestions(); track suggestion) {
            <button type="button" class="folder-modal__suggestion" (click)="pickSuggestion(suggestion)">
              {{ suggestion }}
            </button>
          }
        </div>
      }
    </label>

    <div class="folder-modal__actions">
      @if (isEdit()) {
        <button type="button" class="folder-modal__danger" (click)="onDelete()">
          <ion-icon name="trash-outline"></ion-icon>
          Delete
        </button>
      }
      <span class="folder-modal__spacer"></span>
      <button type="button" class="folder-modal__cancel" (click)="onClose()">Cancel</button>
      <button type="submit" class="folder-modal__save" [disabled]="!canSubmit()">
        {{ isEdit() ? 'Save' : 'Create' }}
      </button>
    </div>
  </form>
</div>
