<section class="achievements-panel">
  <header class="section-header">
    <div>
      <span class="eyebrow">
        <ion-icon name="trophy-outline"></ion-icon>
        Achievements
      </span>
      <h2>{{ achievements().length }} unlocked</h2>
    </div>
  </header>
  <div class="achievement-grid">
    @for (achievement of achievements(); track trackByAchievement($index, achievement)) {
      <article class="achievement-card" [title]="achievement.description">
        <div class="achievement-icon">
          <ion-icon [name]="achievement.icon"></ion-icon>
        </div>
        <div class="achievement-body">
          <strong>{{ achievement.title }}</strong>
          <span>{{ achievement.description }}</span>
        </div>
      </article>
    }
  </div>
</section>
