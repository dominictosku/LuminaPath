<ion-content [fullscreen]="true" class="dashboard-shell">
  <ion-refresher slot="fixed" (ionRefresh)="loadDashboard($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <main class="dashboard">
    <app-dashboard-hero
      class="dash-cell dash-cell--wide"
      [featuredItem]="featuredItem"
      [heroProgress]="heroProgress"
      [isLoading]="isLoading">
    </app-dashboard-hero>

    @if (errorMessage) {
      <section class="notice dash-cell dash-cell--wide">
        <ion-icon name="flame-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </section>
    }

    <app-dashboard-metrics
      class="dash-cell dash-cell--wide"
      [metrics]="metrics">
    </app-dashboard-metrics>

    <app-dashboard-momentum
      class="dash-cell dash-cell--wide"
      [playedHours]="playedHours"
      [completionRate]="completionRate">
    </app-dashboard-momentum>

    <app-dashboard-focus
      class="dash-cell dash-cell--wide"
      [items]="focusItems">
    </app-dashboard-focus>

    <app-dashboard-activity
      class="dash-cell dash-cell--half"
      [items]="activityItems">
    </app-dashboard-activity>

    <app-dashboard-active-rail
      class="dash-cell dash-cell--half"
      [items]="playingItems">
    </app-dashboard-active-rail>

    <app-dashboard-releases
      class="dash-cell dash-cell--half"
      [items]="upcomingReleases">
    </app-dashboard-releases>

    <app-dashboard-backlog
      class="dash-cell dash-cell--half"
      [items]="backlogItems">
    </app-dashboard-backlog>

    <app-dashboard-recent
      class="dash-cell dash-cell--half"
      [items]="recentItems">
    </app-dashboard-recent>

    <app-release-calendar
      class="dash-cell dash-cell--wide dashboard-release-calendar"
      [games]="releasePlanGames"
      [isLoading]="isLoading">
    </app-release-calendar>
  </main>
</ion-content>
