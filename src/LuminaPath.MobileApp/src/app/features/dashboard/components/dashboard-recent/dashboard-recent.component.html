<section class="section-block">
  <div class="section-heading">
    <div>
      <span class="eyebrow">
        <ion-icon name="library-outline"></ion-icon>
        Library
      </span>
      <h2>Recently Added</h2>
    </div>
  </div>

  <div class="library-grid">
    @for (item of items(); track trackByItem($index, item)) {
      <a class="mini-card" [routerLink]="itemRoute(item)">
        <img [src]="imageFor(item)" alt="" loading="lazy" decoding="async" />
        <h3>{{ item.name }}</h3>
        <p>{{ item.kind }}</p>
      </a>
    } @empty {
      <div class="empty-state"><ion-icon name="library-outline" aria-hidden="true"></ion-icon><span>Your collection starts with one great title. Explore titles to add your first favorite.</span></div>
    }
  </div>
</section>
