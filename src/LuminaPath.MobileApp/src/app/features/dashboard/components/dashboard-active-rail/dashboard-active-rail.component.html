<section class="section-block">
  <div class="section-heading">
    <div>
      <span class="eyebrow">
        <ion-icon name="game-controller-outline"></ion-icon>
        Active
      </span>
      <h2>Pick up where you left off</h2>
    </div>
    <ion-badge class="active-count">{{ items().length }}</ion-badge>
  </div>

  @if (items().length) {
    <div class="horizontal-list">
      @for (item of items(); track trackByItem($index, item)) {
        <a class="game-card game-card--large" [routerLink]="itemRoute(item)">
          <img [src]="imageFor(item)" alt="" loading="lazy" decoding="async" />
          <div class="game-card__body">
            <ion-badge>{{ item.kind }}</ion-badge>
            <h3>{{ item.name }}</h3>
            <p>{{ item.context }} · {{ remainingLabel(item) }}</p>
            <div class="progress-track">
              <span [style.width.%]="progressOf(item)"></span>
            </div>
          </div>
        </a>
      }
    </div>
  } @else {
    <div class="empty-state">
      <ion-icon name="game-controller-outline"></ion-icon>
      <span>No active media yet.</span>
    </div>
  }
</section>
