<section class="section-block section-block--wide">
  <div class="section-heading">
    <div>
      <span class="eyebrow">
        <ion-icon name="sparkles-outline"></ion-icon>
        Next up
      </span>
      <h2>Today’s Focus</h2>
    </div>
  </div>

  <div class="focus-grid">
    @for (item of items(); track trackByFocus($index, item)) {
      <a class="focus-card focus-card--{{ item.tone }}" [routerLink]="item.route">
        <div class="focus-card__icon">
          <ion-icon [name]="item.icon"></ion-icon>
        </div>
        <div>
          <h3>{{ item.title }}</h3>
          <p>{{ item.detail }}</p>
          <span class="focus-action">{{ item.actionLabel }} <span aria-hidden="true">→</span></span>
        </div>
      </a>
    }
  </div>
  <a class="section-link" routerLink="/weekly-schedule">Open your planner <span aria-hidden="true">↗</span></a>
</section>
