<app-media-poster
  [title]="item.name" [image]="imageFor(item)" [kind]="mediaMode.singular" [icon]="mediaMode.icon"
  [subtitle]="view.mediaTypeLabel(item, mediaMode)"
  [meta]="view.hasLibraryEntry(item) ? (view.isGamesMode(mediaMode) ? view.playedLabel(item, mediaMode) : view.progressOf(item, mediaMode) + '% watched') : view.releaseLabel(item)"
  [status]="view.statusLabel(item, mediaMode)"
  [progress]="view.hasLibraryEntry(item) ? view.progressOf(item, mediaMode) : null"
  [selecting]="selectionMode" [selected]="selected" [disabled]="isAdding || (selectionMode && !selectable)"
  [actionLabel]="selectionMode ? (selected ? 'Deselect ' : 'Select ') + item.name : 'View details for ' + item.name"
  (open)="openOrSelect(item)"
  (action)="selectionMode ? openOrSelect(item) : details.emit(item)" />
