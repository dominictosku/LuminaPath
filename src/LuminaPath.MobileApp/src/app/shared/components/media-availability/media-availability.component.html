@if (links().length) {
  <section class="availability-panel">
    <header class="availability-header">
      <div>
        <span class="availability-eyebrow">
          <ion-icon [name]="icon()"></ion-icon>
          {{ eyebrow() }}
        </span>
        <h2>{{ heading() }}</h2>
        <p>{{ lead() }}</p>
      </div>
    </header>

    <div class="availability-grid">
      @for (link of links(); track link.id) {
        <a
          class="availability-link"
          [class.availability-link--primary]="link.primary"
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer">
          <span class="availability-link__icon">
            <ion-icon [name]="link.icon"></ion-icon>
          </span>
          <span class="availability-link__copy">
            <strong>{{ link.label }}</strong>
            <small>{{ link.description }}</small>
          </span>
          <ion-icon class="availability-link__open" name="open-outline"></ion-icon>
        </a>
      }
    </div>
  </section>
}
