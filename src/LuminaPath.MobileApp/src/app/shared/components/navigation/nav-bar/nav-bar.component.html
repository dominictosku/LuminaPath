<ion-header *ngIf="!isAuthPage" class="app-header">
  <nav class="mobile-shell">
    <a class="brand" href="/home" aria-label="LuminaPath home">
      <span class="brand-mark">
        <ion-icon name="sparkles-outline"></ion-icon>
      </span>
      <span class="brand-copy">
        <strong>LuminaPath</strong>
        <small>Game life tracker</small>
      </span>
    </a>

    <div class="nav-links" aria-label="Primary navigation">
      <a href="/home" [class.active]="isActive('/home')">
        <ion-icon name="game-controller-outline"></ion-icon>
        <span>Home</span>
      </a>
      <a href="/media" [class.active]="isActive('/media')">
        <ion-icon name="library-outline"></ion-icon>
        <span>Library</span>
      </a>
      <a href="/planing" [class.active]="isActive('/planing')">
        <ion-icon name="calendar-clear-outline"></ion-icon>
        <span>Plan</span>
      </a>
      <a href="/quests" [class.active]="isActive('/quests')">
        <ion-icon name="sparkles-outline"></ion-icon>
        <span>Quests</span>
      </a>
    </div>

    <div class="header-actions">
      <div class="menu-wrap">
        <button
          type="button"
          class="icon-action notification-button"
          aria-label="Open notifications"
          [class.active]="openMenu === 'notifications'"
          (click)="toggleMenu('notifications')">
          <ion-icon name="notifications-outline"></ion-icon>
          <span class="notification-dot"></span>
        </button>

        <section class="dropdown-panel notification-panel" *ngIf="openMenu === 'notifications'">
          <div class="dropdown-heading">
            <span>Notifications</span>
            <strong>3 new</strong>
          </div>
          <a href="/planing" class="notification-item">
            <ion-icon name="calendar-clear-outline"></ion-icon>
            <span>
              <strong>Release watch</strong>
              <small>Check upcoming games this week.</small>
            </span>
          </a>
          <a href="/quests" class="notification-item">
            <ion-icon name="sparkles-outline"></ion-icon>
            <span>
              <strong>Quest streak</strong>
              <small>Train a skill to keep momentum.</small>
            </span>
          </a>
          <a href="/media" class="notification-item">
            <ion-icon name="library-outline"></ion-icon>
            <span>
              <strong>Library cleanup</strong>
              <small>Add playtime details to your backlog.</small>
            </span>
          </a>
        </section>
      </div>

      <div class="menu-wrap">
        <button
          type="button"
          class="icon-action"
          aria-label="Open app menu"
          [class.active]="openMenu === 'apps'"
          (click)="toggleMenu('apps')">
          <ion-icon name="grid-outline"></ion-icon>
        </button>

        <section class="dropdown-panel app-panel" *ngIf="openMenu === 'apps'">
          <div class="dropdown-heading">
            <span>Quick Launch</span>
            <strong>Apps</strong>
          </div>
          <div class="app-grid">
            <a href="/home" (click)="closeMenus()">
              <ion-icon name="game-controller-outline"></ion-icon>
              <span>Dashboard</span>
            </a>
            <a href="/media" (click)="closeMenus()">
              <ion-icon name="library-outline"></ion-icon>
              <span>Library</span>
            </a>
            <a href="/planing" (click)="closeMenus()">
              <ion-icon name="calendar-clear-outline"></ion-icon>
              <span>Planning</span>
            </a>
            <a href="/quests" (click)="closeMenus()">
              <ion-icon name="sparkles-outline"></ion-icon>
              <span>Quests</span>
            </a>
          </div>
        </section>
      </div>

      <button type="button" class="profile-button" aria-label="Sign out" (click)="logout()" [disabled]="isLoggingOut">
        <span class="profile-icon">
          <ion-icon [name]="isLoggingOut ? 'hourglass-outline' : 'person-circle-outline'"></ion-icon>
        </span>
        <span class="profile-copy">
          <strong>{{ isLoggingOut ? 'Signing out' : 'Signed in' }}</strong>
          <small>Sign out</small>
        </span>
        <ion-icon class="logout-icon" name="log-out-outline"></ion-icon>
      </button>
    </div>
  </nav>
</ion-header>
