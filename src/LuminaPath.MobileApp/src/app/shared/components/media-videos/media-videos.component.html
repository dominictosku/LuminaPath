<section class="media-videos">
  <header class="media-videos__header">
    <div>
      <span class="eyebrow">
        <ion-icon name="film-outline"></ion-icon>
        Videos
      </span>
      <h2>{{ headerTitle }}</h2>
    </div>
    @if (isLoading) {
      <ion-spinner name="crescent"></ion-spinner>
    }
  </header>

  @if (canEdit) {
    <app-media-video-upload
      [mediaKind]="mediaKind"
      [disabled]="mediaId === null"
      [isUploading]="isUploading"
      [message]="uploadMessage"
      [resetKey]="uploadResetKey"
      (upload)="uploadVideo($event)" />
  }

  @if (errorMessage) {
    <p class="media-videos__error">{{ errorMessage }}</p>
  }

  @if (!isLoading && !videos.length) {
    <div class="media-videos__empty">
      <ion-icon name="film-outline"></ion-icon>
      <p>No videos yet.</p>
    </div>
  }

  @if (videos.length) {
    <div class="media-videos__grid">
      @for (video of videos; track video.id; let first = $first; let last = $last) {
        <app-media-video-card
          [video]="video"
          [streamUrl]="streamUrl(video)"
          [mediaKind]="mediaKind"
          [canEdit]="canEdit"
          [isFirst]="first"
          [isLast]="last"
          [isMutating]="isMutating"
          (move)="moveVideo(video, $event)"
          (save)="saveVideo(video, $event)"
          (delete)="confirmDelete($event)" />
      }
    </div>
  }
</section>
