version: '3.4'

services:
  luminapath:
    image: ${DOCKER_REGISTRY-}luminapath
    container_name: luminapath
    build:
      context: .
      dockerfile: luminapath/Dockerfile  
    depends_on:
        - db
  db:
     image: "mcr.microsoft.com/mssql/server:2022-latest"
     container_name: luminapath_DB
     volumes:
         - luminapath-DB:/var/opt/mssql
     ports:
         - "1433:1433"
     environment:
         MSSQL_SA_PASSWORD: "S3cur3P@ssW0rd!"
         ACCEPT_EULA: "Y"
volumes:
    luminapath-DB:
